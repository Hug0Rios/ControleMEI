services:
  postgres:
    image: postgres:16-alpine
    container_name: controlemei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: controlemei
      POSTGRES_USER: controlemei
      POSTGRES_PASSWORD: controlemei
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlemei -d controlemei"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./web
    container_name: controlemei-app
    restart: unless-stopped
    environment:
      APP_NAME: Meu MEI Brasil
      APP_ENV: local
      APP_DEBUG: "true"
      # Chave apenas para desenvolvimento local. Em produção, gere outra com: php artisan key:generate --show
      APP_KEY: base64:LLkVCe7ldsNAKdXfLVeujcHsroXmkHvO2SZoquQW6vg=
      APP_URL: http://127.0.0.1:8000
      APP_LOCALE: pt_BR
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: controlemei
      DB_USERNAME: controlemei
      DB_PASSWORD: controlemei
      SESSION_DRIVER: database
      CACHE_STORE: database
      MAIL_MAILER: log
      LOG_CHANNEL: stderr
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
